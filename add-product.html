<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - CartHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --brand-sage: #556b2f;
      --brand-brown: #4a3b32;
      --brand-beige: #f5f2eb;
    }
    body { background-color: var(--brand-beige) !important; color: var(--brand-brown); }
    .bg-sage { background-color: var(--brand-sage) !important; }
    .btn-sage { background-color: var(--brand-sage); color: white; }
    .btn-sage:hover { background-color: #3b4d1f; color: white; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-sage">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">CartHub</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Back to Shop</a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card border-0 shadow-sm p-4" style="background-color: #ffffff;">
          <h3 class="fw-bold mb-1">List a New Product</h3>
          <p class="text-muted small mb-4">Add your product details to showcase on CartHub</p>

          <form action="index.html">
            <div class="mb-3">
              <label class="form-label">Seller Name</label>
              <select class="form-select" required>
                <option value="" selected disabled>Select seller</option>
                <option value="Hania">Hania</option>
                <option value="Anna">Anna</option>
                <option value="Adina">Adina</option>
                <option value="Raffay">Raffay</option>
                <option value="Hamza">Hamza</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Product Name</label>
              <input type="text" class="form-control" placeholder="e.g. Wireless Ergonomic Mouse" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Price ($)</label>
                <input type="number" class="form-control" placeholder="49.99" step="0.01" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-select" required>
                  <option>Tech</option>
                  <option>Wearables</option>
                  <option>Footwear</option>
                  <option>Accessories</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="url" class="form-control" placeholder="https://images.unsplash.com/..." required>
              <small class="text-muted">Paste an image link for the product</small>
            </div>

            <div class="mb-4">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" placeholder="Brief details about the item..." required></textarea>
            </div>

            <button type="submit" class="btn btn-sage w-100 py-2">Publish Product</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
