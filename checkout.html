<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - CartHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root {
      --brand-sage: #556b2f;
      --brand-brown: #4a3b32;
      --brand-beige: #f5f2eb;
    }
    body { background-color: var(--brand-beige) !important; color: var(--brand-brown); }
    .bg-sage { background-color: var(--brand-sage) !important; }
    .btn-brown { background-color: var(--brand-brown); color: var(--brand-beige); }
    .btn-brown:hover { background-color: #2e241f; color: var(--brand-beige); }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-sage sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">CartHub</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Continue Shopping</a>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="fw-bold mb-4">Your Cart & Checkout</h2>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm p-4 mb-4" style="background-color: #ffffff;">
          <h4 class="fw-bold mb-3">Shopping Cart</h4>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th>Quantity</th>
                  <th>Total</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Studio Headphones</td>
                  <td>$149.00</td>
                  <td><input type="number" class="form-control form-control-sm text-center" value="1" style="width: 60px;"></td>
                  <td>$149.00</td>
                  <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
                </tr>
                <tr>
                  <td>Minimalist Watch</td>
                  <td>$199.00</td>
                  <td><input type="number" class="form-control form-control-sm text-center" value="1" style="width: 60px;"></td>
                  <td>$199.00</td>
                  <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <span class="fs-5 fw-bold">Subtotal:</span>
            <span class="fs-4 fw-bold" style="color: #556b2f;">$348.00</span>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card border-0 shadow-sm p-4" style="background-color: #ffffff;">
          <h4 class="fw-bold mb-3">Shipping & Payment</h4>
          <form action="index.html">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" value="Hamza Khan" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Shipping Address</label>
              <input type="text" class="form-control" placeholder="House / Street / City" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">CVV</label>
                <input type="text" class="form-control" placeholder="123" required>
              </div>
            </div>
            <button type="submit" class="btn btn-brown w-100 py-2">Place Order ($348.00)</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
